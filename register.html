<!DOCTYPE html>
<html>
    <head>
        <title>Register Form</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div id="reg_form">
            <form action="register.php" method="post">
                <div>
                <label>First Name </label> 
                    <input type="text" id="first_name" name="first_name">
                </div>
                <div>
                    <label>Last Name </label> 
                    <input type="text" id="last_name" name="last_name">
                </div>
                <div>
                    <label>Gender</label>
                    <input type="radio" name="gender" value="M"/>Male
                    <input type="radio" name="gender" value="F"/>Female
                </div>
                <div>
                    <label>Interests</label>
                    <input type="checkbox" name="interest[]" value="Riding"/>Riding
                     <input type="checkbox" name="interest[]" value="Hiking"/>Hiking
                      <input type="checkbox" name="interest[]" value="Traveling"/>Traveling
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" id="email" name="email"/>
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" id="password" name="password"/>
                </div>
                <div>
                    <input type="submit" id="submit_btn" name="submit"/>
                </div>
            </form>
        </div>
    </body>
</html>
